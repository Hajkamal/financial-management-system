<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Deep Navy to Tech Azure) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#1C2541" />
      <stop offset="100%" stopColor="#0A3A60" />
    </linearGradient>

    <!-- Cyan / Turquoise Glow Gradient for "Madd" of Alef (آینده) -->
    <linearGradient id="maddGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="50%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#67E8F9" />
    </linearGradient>

    <!-- Pillar Gradient for Alef (استحکام مالی) -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#93C5FD" />
    </linearGradient>

    <!-- Creative Gold Gradient for Innovation Spark (خلاق) -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glow Filter -->
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for Favicon -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGradient)" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.6" />
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.25" />

  <g filter="url(#logoShadow)">
    <!-- 1. The Dynamic Wave / Madd of Persian 'آ' (نماد آینده، افق و حرکت رو به جلو) -->
    <path 
      d="M32 36C40 24 54 24 64 33C74 42 88 40 96 28" 
      fill="none" 
      stroke="url(#maddGrad)" 
      stroke-width="9" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- 2. The Solid Vertical Stem / Alef 'ا' (نماد ستون ثبات و رشد مالی) -->
    <path 
      d="M64 48V100" 
      stroke="url(#pillarGrad)" 
      stroke-width="10" 
      stroke-linecap="round" 
    />

    <!-- 3. Ascending Financial Growth Line (نمودار صعودی و توسعه) -->
    <path 
      d="M40 98L64 74L86 86L102 60" 
      fill="none" 
      stroke="#38BDF8" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      stroke-dasharray="1 0"
    />

    <!-- 4. Ascending Arrowhead at Growth Peak -->
    <polygon points="102,52 108,66 94,64" fill="#38BDF8" />

    <!-- 5. Creative Diamond Spark Node (نقطه نبوغ و نوآوری «خلاق») -->
    <g transform="translate(94, 26)" filter="url(#sparkGlow)">
      <polygon points="0,-8 7,0 0,8 -7,0" fill="url(#goldSpark)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- 6. Left Stability Dot -->
    <circle cx="34" cy="98" r="4.5" fill="#60A5FA" />
  </g>
</svg>
