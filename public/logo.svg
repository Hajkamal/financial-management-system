<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E3A8A" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#0D9488" />
    </linearGradient>

    <!-- Accent Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#67E8F9" />
    </linearGradient>

    <!-- Golden Spark Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for Browser Favicon -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Inner Soft Highlight Ring -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Stylized Geometric Finance / Growth Monogram for "آینده نگاران خلاق" -->
  <g filter="url(#shadow)">
    <!-- Base Rising Pillar 1 -->
    <rect x="15" y="34" width="7" height="15" rx="3" fill="#60A5FA" fill-opacity="0.75" />
    
    <!-- Base Rising Pillar 2 -->
    <rect x="25.5" y="26" width="7" height="23" rx="3" fill="#93C5FD" fill-opacity="0.9" />

    <!-- Upward Arrow & Creative Forward Dynamic Arc (Ayandeh Vector) -->
    <path 
      d="M36 49V22C36 19.5 37.8 17.5 40.2 17.5H43" 
      stroke="url(#cyanGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Dynamic Growth Arrow Peak -->
    <path 
      d="M38 12L49 19L41 27" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <polygon points="41,13 49,19 42,25" fill="#38BDF8" />

    <!-- Golden Creative Spark / Coin Node (Prosperity & Innovation) -->
    <circle cx="20" cy="18" r="4.5" fill="url(#goldGrad)" filter="url(#glow)" />
    <path d="M20 15V21M17 18H23" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
